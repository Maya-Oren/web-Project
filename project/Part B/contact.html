<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צור קשר | FLORA Collective</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #dce8d2;
}

/* HEADER */
header {
  background: linear-gradient(135deg,#0d3b20,#1f5c35);
  color: white;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
}

/* HERO */
.hero {
  height: 250px;
  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
    url("./picture/picture aroids.jpg");
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
}

.hero h1 {
  color: white;
  font-size: 40px;
}

/* FORM */
.contact-box {
  max-width: 600px;
  margin: -60px auto 40px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  animation: fadeUp 1s ease;
}

.contact-box h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #174425;
}

.contact-box input,
.contact-box textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.contact-box textarea {
  resize: none;
  height: 120px;
}

.contact-box button {
  width: 100%;
  padding: 12px;
  border: none;
  background: #174425;
  color: white;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.contact-box button:hover {
  background: #1f5c35;
}

/* INFO */
.info {
  text-align: center;
  margin-top: 20px;
  color: #355b3f;
}

/* ANIMATION */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>
  <div>FLORA Collective</div>

  <nav>
    <a href="index.html">בית</a>
    <a href="catlog.html">קטלוג</a>
    <a href="contact.html">צור קשר</a>
  </nav>
</header>

<div class="hero">
  <h1>צור קשר</h1>
</div>

<div class="contact-box">
  <h2>נשמח לשמוע ממך 🌿</h2>

  <input type="text" placeholder="שם מלא">
  <input type="email" placeholder="אימייל">
  <textarea placeholder="הודעה"></textarea>

  <button onclick="sendMessage()">שליחה</button>

  <div class="info">
    📞 053-2254042<br>
    📸 flora_collective
  </div>
</div>

<script>
function sendMessage() {
  alert("ההודעה נשלחה בהצלחה 🌱");
}
</script>

</body>
</html>
