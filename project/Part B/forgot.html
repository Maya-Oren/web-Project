<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שחזור סיסמה</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  min-height: 100vh;
  background:
    linear-gradient(rgba(13,59,32,0.65), rgba(13,59,32,0.65)),
    url("/picture/picture aroids.png");
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  width: 350px;
  background: rgba(238,246,233,0.95);
  padding: 35px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
  margin-bottom: 10px;
  color: #0d3b20;
}

p {
  font-size: 14px;
  color: #355b3f;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 25px;
  border: 1px solid #b7c9ad;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 25px;
  background: #0d3b20;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #1f5c35;
}

a {
  display: block;
  margin-top: 15px;
  color: #0d3b20;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="box">
  <h1>שחזור סיסמה</h1>
  <p>הכנס את האימייל שלך ונשלח לך קישור לאיפוס הסיסמה</p>

  <input type="email" placeholder="אימייל">
  <button>שלח קישור</button>

  <a href="login.html">חזרה להתחברות</a>
  <a href="register.html">אין לך חשבון? הרשמה</a>
</div>

</body>
</html>
