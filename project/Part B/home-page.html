<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLORA Collective</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d3b20;
}

/* HEADER */
header {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.logo {
  color: white;
  font-size: 26px;
  font-weight: bold;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 25px;
  font-size: 16px;
}

/* HERO */
.hero {
  height: 100vh;
  background:
    linear-gradient(rgba(8,45,25,0.4), rgba(8,45,25,0.75)),
    url("picture/picture aroids.jpg");
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  text-align: center;
}

/* FLOATING ELEMENTS */
.leaf {
  position: absolute;
  font-size: 60px;
  opacity: 0.7;
  animation: float 6s ease-in-out infinite;
}

.leaf1 { top: 20%; right: 10%; }
.leaf2 { bottom: 20%; left: 10%; animation-delay: 2s; }
.leaf3 { top: 60%; right: 70%; animation-delay: 4s; }

/* CONTENT */
.content {
  color: white;
  max-width: 750px;
  padding: 50px;
  border-radius: 35px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  animation: fadeIn 1.2s ease;
}

.content h1 {
  font-size: 60px;
  margin-bottom: 20px;
}

.content p {
  font-size: 22px;
  line-height: 1.8;
  margin-bottom: 30px;
}

/* BUTTON */
.btn {
  display: inline-block;
  padding: 15px 35px;
  border-radius: 40px;
  background: #dce8d2;
  color: #174425;
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  background: white;
  box-shadow: 0 10px 25px rgba(255,255,255,0.4);
}

/* ANIMATIONS */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9) translateY(40px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-30px); }
}
</style>
</head>

<body>

<header>
  <div class="logo">FLORA</div>

  <nav>
    <a href="index.html">בית</a>
    <a href="catlog.html">קטלוג</a>
  </nav>
</header>

<section class="hero">

  <div class="leaf leaf1">🌿</div>
  <div class="leaf leaf2">🍃</div>
  <div class="leaf leaf3">🪴</div>

  <div class="content">
    <h1>FLORA Collective</h1>

    <p>
      עולם של צמחים נדירים, עיצוב טבעי והשראה ירוקה לבית שלך.
      כאן מתחיל החיבור שלך לטבע — בצורה הכי יפה שיש.
    </p>

    <a href="catlog.html" class="btn">כניסה לקטלוג</a>
  </div>

</section>

</body>
</html>
