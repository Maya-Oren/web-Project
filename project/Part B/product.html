<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מוצר | FLORA Collective</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #dce8d2;
  color: #173c23;
}

.container {
  max-width: 900px;
  margin: 50px auto;
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
}

.image {
  flex: 1;
  min-width: 280px;
}

.image img {
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  border-radius: 14px;
  background: #eef6e9;
}

.details {
  flex: 1;
  min-width: 280px;
}

h1 {
  color: #0d3b20;
}

.price {
  font-size: 28px;
  color: #1f5c35;
  font-weight: bold;
  margin: 15px 0;
}

.desc {
  font-size: 16px;
  line-height: 1.7;
  color: #355b3f;
  white-space: pre-line;
}

.option-box,
.quantity {
  margin: 18px 0;
}

.option-box label,
.quantity label {
  font-weight: bold;
  display: block;
  margin-bottom: 8px;
}

select,
.quantity input {
  width: 100%;
  padding: 12px;
  border: 1px solid #b7c9ad;
  border-radius: 20px;
  font-size: 15px;
  box-sizing: border-box;
}

button {
  margin-top: 15px;
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 25px;
  background: #174425;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #1f5c35;
}

.message {
  margin-top: 12px;
  color: #1f5c35;
  font-weight: bold;
  display: none;
}

.back {
  display: block;
  margin-top: 20px;
  color: #0d3b20;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <div class="image">
    <img id="productImage" alt="">
  </div>

  <div class="details">
    <h1 id="productName"></h1>

    <div class="price" id="productPrice"></div>

    <div class="option-box" id="optionBox" style="display:none;">
      <label>בחר נפח:</label>
      <select id="productOption"></select>
    </div>

    <div class="quantity">
      <label>כמות:</label>
      <input type="number" id="quantity" value="1" min="1">
    </div>

    <p class="desc" id="productDesc"></p>

    <button onclick="addToCart()">הוספה לסל</button>
    <div class="message" id="message">המוצר נוסף לסל ✅</div>

    <a class="back" href="catlog.html">← חזרה לקטלוג</a>
    <a class="back" href="cart.html">🛒 מעבר לעגלה</a>
  </div>
</div>

<script src="products.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const product = products[id];

let selectedProduct = null;

if (product) {
  document.getElementById("productName").innerText = product.name;
  document.getElementById("productImage").src = product.image;
  document.getElementById("productImage").alt = product.name;
  document.getElementById("productDesc").innerText = product.desc || "";

  const optionBox = document.getElementById("optionBox");
  const productOption = document.getElementById("productOption");

  if (product.options && product.options.length > 0) {
    optionBox.style.display = "block";

    product.options.forEach((option, index) => {
      productOption.innerHTML += `
        <option value="${index}">
          ${option.size} - ${option.price}
        </option>
      `;
    });

    selectedProduct = product.options[0];

    productOption.addEventListener("change", function () {
      selectedProduct = product.options[this.value];
      updatePrice();
    });

  } else {
    selectedProduct = {
      size: "",
      price: product.price
    };
  }

  updatePrice();
  document.getElementById("quantity").addEventListener("input", updatePrice);

} else {
  document.body.innerHTML = "<h1 style='text-align:center; margin-top:80px;'>המוצר לא נמצא</h1>";
}

function getPriceNumber(priceText) {
  return Number(String(priceText).replace("₪", "").replace(",", "").trim());
}

function updatePrice() {
  let quantity = Number(document.getElementById("quantity").value);

  if (quantity < 1 || isNaN(quantity)) {
    quantity = 1;
    document.getElementById("quantity").value = 1;
  }

  const priceNumber = getPriceNumber(selectedProduct.price);
  const total = priceNumber * quantity;

  document.getElementById("productPrice").innerText = "₪" + total;
}

function addToCart() {
  let quantity = Number(document.getElementById("quantity").value);

  if (quantity < 1 || isNaN(quantity)) {
    quantity = 1;
    document.getElementById("quantity").value = 1;
  }

  const priceNumber = getPriceNumber(selectedProduct.price);
  const total = priceNumber * quantity;

  const cartItem = {
    id: id,
    name: product.name,
    image: product.image,
    option: selectedProduct.size || "",
    unitPrice: selectedProduct.price,
    quantity: quantity,
    total: "₪" + total
  };

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  const existingItem = cart.find(item =>
    item.id === cartItem.id && item.option === cartItem.option
  );

  if (existingItem) {
    existingItem.quantity = Number(existingItem.quantity) + quantity;
    const newTotal = getPriceNumber(existingItem.unitPrice) * existingItem.quantity;
    existingItem.total = "₪" + newTotal;
  } else {
    cart.push(cartItem);
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  const message = document.getElementById("message");
  message.style.display = "block";
  message.innerText = "המוצר נוסף לסל ✅";
}
</script>

</body>
</html>
