<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרשמה</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  min-height: 100vh;
  background:
    linear-gradient(rgba(13,59,32,0.65), rgba(13,59,32,0.65)),
    url("/picture/picture aroids.png");
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  width: 380px;
  background: rgba(238,246,233,0.95);
  padding: 35px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
  margin-bottom: 15px;
  color: #0d3b20;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 25px;
  border: 1px solid #b7c9ad;
  margin-bottom: 12px;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg,#0d3b20,#2f8f46);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: linear-gradient(135deg,#145c2f,#39a955);
}

a {
  display: block;
  margin-top: 15px;
  color: #0d3b20;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="box">
  <h1>הרשמה</h1>

  <input type="text" placeholder="שם מלא">
  <input type="email" placeholder="אימייל">
  <input type="password" placeholder="סיסמה">
  <input type="password" placeholder="אימות סיסמה">

  <button>צור חשבון</button>

  <a href="login.html">כבר יש לך חשבון? התחבר</a>
</div>

</body>
</html>
