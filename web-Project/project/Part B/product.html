<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מוצר | FLORA Collective</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="simple-page product-page">
  <div class="product-container">
    <div class="product-image"><img id="productImage" alt=""></div>
    <div class="product-details">
      <h1 id="productName"></h1>
      <div class="price big-price" id="productPrice"></div>
      <div class="form-row" id="optionBox" style="display:none;">
        <label for="productOption">בחרי נפח / אפשרות:</label>
        <select id="productOption"></select>
      </div>
      <div class="form-row">
        <label for="quantity">כמות:</label>
        <input type="number" id="quantity" value="1" min="1">
      </div>
      <p class="desc" id="productDesc"></p>
      <button id="addToCartBtn" class="btn full-btn">הוספה לסל</button>
      <div class="success-message" id="message">המוצר נוסף לסל ✅</div>
      <a class="back" href="catlog.html">← חזרה לקטלוג</a>
      <a class="back" href="cart.html">🛒 מעבר לעגלה</a>
    </div>
  </div>
</div>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
</body>
</html>
